name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run oracle:check          # golden.json must equal the oracle's output (no hand edits)
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run csp:smoke             # production build + CSP/hydration/header gate
      - run: npm audit --omit=dev --audit-level=high      # gate: what ships to users (0 findings on 25 Nov)
      - run: npm audit --audit-level=high || true          # visibility only: dev-tool advisories (see SECURITY.md)
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
